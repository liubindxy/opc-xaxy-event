<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动管理 / OPC 雄安</title><link rel="stylesheet" href="/style.css"><script defer src="/icons.js"></script><script type="module" src="/admin.js"></script></head><body><header><nav><a class="brand" href="/admin">OPC<span> / </span>CONTROL</a><a href="/" target="_blank" rel="noopener">查看报名页 ↗</a></nav></header><main><div class="admin-title"><div><div class="eyebrow">MEETUP_001 / 雄安</div><h1>首场活动管理</h1><small id="identity">正在验证管理员…</small></div><div class="actions"><button id="settings"><span data-icon="settings"></span>活动设置</button><a class="button" href="/api/admin/export"><span data-icon="download"></span>导出CSV</a><button id="refresh" class="icon-button" title="刷新名单" aria-label="刷新名单"><span data-icon="refresh"></span></button></div></div><p id="message" class="message" role="status" aria-live="polite"></p><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="搜索姓名、项目、城市、资源需求" aria-label="搜索申请"><select id="filter" aria-label="审核状态"><option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="waitlisted">候补</option><option value="rejected">未通过</option></select><span id="count" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>申请人</th><th>项目 / 关注方向</th><th>审核状态</th><th>出席 / 签到</th><th>申请时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><section class="section-rule"><h2>招募链接</h2><p class="muted">不同渠道使用不同链接，申请来源会记录在名单中。</p><div class="sources"><button data-source="poster">复制海报链接</button><button data-source="xinghuo">复制星火馆链接</button><button data-source="opc">复制OPC社群链接</button><button data-source="xingyuan">复制星猿科技链接</button></div></section></main>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title">申请详情</h2><button data-close="detail" class="icon-button" aria-label="关闭详情" title="关闭"><span data-icon="close"></span></button></div><div class="split"><dl id="detail-data"></dl><form id="review"><label class="field"><span>审核状态</span><select name="status"><option value="pending">待审核</option><option value="approved">已通过</option><option value="waitlisted">候补</option><option value="rejected">未通过</option></select></label><label class="checks"><input name="notified" type="checkbox"><span>已通过微信或其他渠道通知</span></label><label class="checks"><input name="checked_in" type="checkbox"><span>已现场签到（仅通过者）</span></label><label class="field"><span>内部备注</span><textarea name="note" maxlength="1000" placeholder="审核原因、对接事项或跟进负责人"></textarea></label><div class="actions section-rule"><button type="submit" class="primary"><span data-icon="check"></span>保存审核</button><button type="button" id="notification"><span data-icon="copy"></span>复制通知文案</button></div><p id="detail-message" class="message" role="status" aria-live="polite"></p><p class="muted">通知文案按当前选择生成，需手动发送。保存审核后，参与者查询页才会更新。</p></form></div></dialog>
<dialog id="event-dialog"><div class="dialog-head"><h2>活动设置</h2><button data-close="event-dialog" class="icon-button" title="关闭" aria-label="关闭设置"><span data-icon="close"></span></button></div><form id="event-form" class="settings-grid"><label class="field"><span>活动标题</span><input name="title" required maxlength="140"></label><label class="field"><span>时间与日期</span><input name="date_label" required maxlength="140"></label><label class="field"><span>场地、地址与主办方联系方式</span><input name="venue" required maxlength="200"></label><label class="field"><span>录取名额</span><input name="capacity" type="number" min="1" max="100" required></label><label class="checks"><input name="registration_open" type="checkbox"><span>开放报名申请</span></label><p class="muted">正式开放前，请填写准确时间、地址和联系方式，并完成验证配置及手机扫码测试。</p><button type="submit" class="primary">保存活动设置</button><p id="event-message" class="message" role="status" aria-live="polite"></p></form></dialog></body></html>
